name: Build Rocket Pocket IPA

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'RocketPocket/ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'RocketPocket/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: RocketPocket/ios
        run: xcodegen generate

      - name: Build the app
        working-directory: RocketPocket/ios
        run: |
          xcodebuild \
            -project RocketPocket.xcodeproj \
            -scheme RocketPocket \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      # An .ipa is just a zip with the .app inside a Payload directory. Building without a
      # signing identity produces an unsigned IPA, which is what sideloading tools such as
      # AltStore or Sideloadly expect — they re-sign it with the user's own Apple ID.
      - name: Package the IPA
        working-directory: RocketPocket/ios
        run: |
          APP="build/Build/Products/Release-iphoneos/RocketPocket.app"
          test -d "$APP" || { echo "Build produced no .app at $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RocketPocket.ipa Payload
          ls -lh RocketPocket.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: rocket-pocket-ipa
          path: RocketPocket/ios/RocketPocket.ipa
          if-no-files-found: error

      - name: Publish the IPA to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd RocketPocket/ios
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest RocketPocket.ipa --clobber
          else
            gh release create latest RocketPocket.ipa \
              --title "Rocket Pocket — latest builds" \
              --notes "Unsigned IPA for iPhone and iPad, rebuilt automatically on every push. Sideload it with AltStore or Sideloadly."
          fi
