name: Build Rocket Pocket IPA

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'RocketPocket/ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'RocketPocket/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    permissions:
      contents: write

    env:
      # Signing turns on by itself once the certificate secret exists. Until then the job still
      # produces a working unsigned IPA, so the build never blocks on account setup.
      SIGNING_ENABLED: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.rocketpocket.car' }}
      EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'development' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: RocketPocket/ios
        env:
          PRODUCT_BUNDLE_IDENTIFIER: ${{ env.BUNDLE_ID }}
        run: |
          # Keep the bundle identifier in step with the provisioning profile, which is issued for
          # one specific identifier and will refuse to sign anything else.
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER: .*|PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID|" project.yml
          xcodegen generate

      # Runs before either build path: a logic regression should fail the job rather than ship
      # in an IPA. The simulator needs no signing, so this works with or without a certificate.
      - name: Run the unit tests
        working-directory: RocketPocket/ios
        run: |
          set -euo pipefail
          # Resolve a real simulator rather than hard-coding a model name: the runner image
          # changes its bundled devices over time, and a stale name fails the job for a reason
          # that has nothing to do with the code. Retrying a different name would be worse — it
          # could mask an actual test failure — so this picks one device and runs once.
          UDID="$(xcrun simctl list devices available \
            | grep -E '^ +iPhone' \
            | head -n 1 \
            | grep -oE '[0-9A-Fa-f-]{36}')"
          test -n "$UDID" || { echo "No iPhone simulator available on this runner"; exit 1; }
          echo "Testing on simulator $UDID"

          xcodebuild test \
            -project RocketPocket.xcodeproj \
            -scheme RocketPocket \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # ---------------------------------------------------------------------------------------
      # Signed path — needs IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD,
      # IOS_PROVISIONING_PROFILE_BASE64 and IOS_TEAM_ID in the repository secrets.
      # ---------------------------------------------------------------------------------------

      - name: Import the signing certificate and profile
        if: env.SIGNING_ENABLED == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # A throwaway keychain, unlocked only for this job and discarded with the runner.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PLIST="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")"
          echo "$PLIST" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Imported profile: $PROFILE_NAME"

      - name: Archive and export a signed IPA
        if: env.SIGNING_ENABLED == 'true'
        working-directory: RocketPocket/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project RocketPocket.xcodeproj \
            -scheme RocketPocket \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/RocketPocket.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/RocketPocket.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

          mv build/export/*.ipa RocketPocket.ipa
          ls -lh RocketPocket.ipa

      # ---------------------------------------------------------------------------------------
      # Unsigned fallback — installable with AltStore or Sideloadly, which re-sign it themselves.
      # ---------------------------------------------------------------------------------------

      - name: Build and package an unsigned IPA
        if: env.SIGNING_ENABLED != 'true'
        working-directory: RocketPocket/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project RocketPocket.xcodeproj \
            -scheme RocketPocket \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

          APP="build/Build/Products/Release-iphoneos/RocketPocket.app"
          test -d "$APP" || { echo "Build produced no .app at $APP"; exit 1; }

          # An .ipa is just a zip with the .app inside a Payload directory.
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RocketPocket.ipa Payload
          ls -lh RocketPocket.ipa

      # The plist inside the .app is what actually ships, and it is not the file in the repo —
      # a misconfigured project can silently replace it. A build missing the Bluetooth usage
      # string installs fine and then gets killed by iOS the moment it scans, so this is checked
      # on the packaged artifact rather than trusted.
      - name: Verify the shipped Info.plist
        working-directory: RocketPocket/ios
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          unzip -q RocketPocket.ipa -d verify
          PLIST="$(find verify/Payload -maxdepth 2 -name Info.plist | head -n 1)"
          test -n "$PLIST" || { echo "No Info.plist inside the IPA"; exit 1; }

          for key in NSBluetoothAlwaysUsageDescription UISupportedInterfaceOrientations; do
            if ! /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              echo "::error::$key is missing from the shipped Info.plist"
              exit 1
            fi
          done

          ORIENTATIONS="$(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$PLIST")"
          case "$ORIENTATIONS" in
            *Portrait*) echo "::error::Portrait is allowed; the dashboard is landscape-only"; exit 1 ;;
          esac

          echo "Info.plist verified: Bluetooth usage string present, landscape-only."
          rm -rf verify

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: rocket-pocket-ipa
          path: RocketPocket/ios/RocketPocket.ipa
          if-no-files-found: error

      - name: Publish the IPA to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd RocketPocket/ios
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest RocketPocket.ipa --clobber
          else
            gh release create latest RocketPocket.ipa \
              --title "Rocket Pocket — latest builds" \
              --notes "Rebuilt automatically on every push."
          fi
