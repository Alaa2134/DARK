name: Build Rocket Pocket APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'RocketPocket/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'RocketPocket/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    # Needed by the release step below, which publishes the APK for direct download.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: RocketPocket
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: rocket-pocket-debug-apk
          path: RocketPocket/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # An Actions artifact downloads as a zip and needs a signed-in GitHub account, which is
      # awkward on a tablet. Publishing the same APK to a rolling "latest" release gives one
      # stable link that downloads the .apk directly and installs with a tap.
      - name: Publish the APK to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp RocketPocket/app/build/outputs/apk/debug/app-debug.apk RocketPocket.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest RocketPocket.apk --clobber
          else
            gh release create latest RocketPocket.apk \
              --title "Rocket Pocket — latest APK" \
              --notes "Debug APK, rebuilt automatically on every push. Download RocketPocket.apk and install it directly."
          fi
