# XcodeGen spec. Generating the Xcode project from this instead of committing a .xcodeproj
# keeps the repository free of the huge, merge-hostile pbxproj file, and lets CI rebuild the
# project deterministically. Regenerate locally with:  brew install xcodegen && xcodegen generate

name: RocketPocket

options:
  bundleIdPrefix: com.rocketpocket
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  RocketPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rocketpocket.car
        PRODUCT_NAME: RocketPocket
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        ENABLE_BITCODE: "NO"
